# WealthyNest backend reverse proxy. Terminates TLS using a Cloudflare Origin CA certificate
# (Cloudflare -> Nginx is "Full (strict)" mode) and proxies to the Spring Boot app on 8080.
#
# Cert/key expected at /etc/nginx/ssl/cloudflare-origin.{pem,key} - see
# docs/deployment-guide.md "TLS: Cloudflare Origin CA" for how to generate and install the real
# one. bootstrap-ec2.sh drops in a temporary self-signed pair if they're missing so Nginx can
# still start, but that's not meant to serve real traffic.

# Cloudflare's own edge IPs, so $remote_addr (and the X-Real-IP we forward) reflects the actual
# client instead of Cloudflare's proxy IP. Keep this in sync with cdk.json's
# cloudflareIpv4Ranges/cloudflareIpv6Ranges - same list, same source (cloudflare.com/ips-v4,
# /ips-v6) - the security group and this file are two independent enforcement points for the same
# trust boundary and both need updating if Cloudflare ever changes their ranges.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name api.wealthynest.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.wealthynest.in;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 20m; # CSV/CAS-PDF statement import uploads

    # /api/v1/statement-import and /cas-import parse a whole file synchronously - a slow client
    # upload or a large PDF shouldn't hit Nginx's default 60s and 500-error before the backend
    # itself has a chance to respond.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Local-only health check target (backend.yml's post-deploy verification and the CloudWatch
    # agent both hit this over plain HTTP on localhost, not through Cloudflare).
    location /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
}
