spring:
  application:
    name: wealthynest-api
  profiles:
    active: ${APP_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/wealthynest}
    username: ${DB_USERNAME:wealthynest}
    password: ${DB_PASSWORD:wealthynest}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: WealthyNestHikariPool
      auto-commit: true
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      repositories:
        enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 600000
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:af9722001@smtp-brevo.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain
  http2:
    enabled: true

wealthynest:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-in-production-min-256-bits-long}
      access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:7200000}
      refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:2592000000}
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    rate-limit:
      auth-requests-per-minute: 10
      api-requests-per-minute: 200
  pagination:
    default-page-size: 20
    max-page-size: 100
  mail:
    from: "WealthyNest <noreply@wealthynest.in>"
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    reset-token-expiry-minutes: 15
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:}
    rp-name: WealthyNest
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Disable the SMTP health probe. Spring Actuator's MailHealthIndicator opens
    # a live TCP connection to the SMTP relay on every /actuator/health call
    # (every 30 s via the Docker healthcheck). This floods logs with
    # UnknownHostException when the relay is temporarily unreachable and causes
    # the overall health status to report DOWN even when the app itself is fine.
    # Actual email send failures are surfaced in application logs at ERROR level.
    mail:
      enabled: false

logging:
  level:
    com.wealthynest: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
