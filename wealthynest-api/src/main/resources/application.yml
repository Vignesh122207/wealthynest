spring:
  application:
    name: wealthynest-api
  threads:
    virtual:
      # Tomcat serves each request on a virtual thread instead of a platform thread, so blocking
      # JDBC/Redis/external-HTTP calls (the bulk of every request in this app) no longer consume a
      # limited platform-thread slot for their full duration — meaningfully higher concurrency
      # headroom under load. Safe here: the codebase has exactly one `synchronized` block (a rare,
      # short-lived double-checked-locking init in AuthServiceImpl), so pinning risk is negligible.
      enabled: true
  profiles:
    active: ${APP_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/wealthynest}
    username: ${DB_USERNAME:wealthynest}
    password: ${DB_PASSWORD:wealthynest}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: WealthyNestHikariPool
      auto-commit: true
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      repositories:
        enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 600000
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:af9722001@smtp-brevo.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain
  http2:
    enabled: true

wealthynest:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-in-production-min-256-bits-long}
      access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:7200000}
      refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:2592000000}
    vault:
      encryption-key: ${VAULT_ENCRYPTION_KEY:change-this-key-in-production-must-be-32-byte-base64}
      hash-pepper: ${VAULT_HASH_PEPPER:change-this-pepper-in-production}
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    rate-limit:
      auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
      api-requests-per-minute: ${RATE_LIMIT_API_PER_MINUTE:200}
      trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  cookie:
    # Must be true for the httpOnly refresh-token cookie in any environment served over HTTPS —
    # a Secure cookie is silently dropped by the browser over plain HTTP, so this is false only in
    # application-dev.yml (local docker-compose, no TLS).
    secure: ${COOKIE_SECURE:true}
  pagination:
    default-page-size: 20
    max-page-size: 100
  mail:
    from: "WealthyNest <noreply@wealthynest.in>"
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    reset-token-expiry-minutes: 15
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:}
    rp-name: WealthyNest
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    # Only needed for the web popup-code fallback (AuthServiceImpl.googleLoginPopup) — the primary
    # web sign-in (ID token, googleLogin) never needs a secret. Same "Web application" OAuth
    # client as client-id above; fetch its secret from Google Cloud Console > Credentials.
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    native:
      client-id: ${GOOGLE_NATIVE_CLIENT_ID:}
      client-secret: ${GOOGLE_NATIVE_CLIENT_SECRET:}
  fcm:
    # Base64-encoded Firebase service-account JSON. Blank in local/dev/CI — FirebaseConfig skips
    # initialization and push sends become a no-op, same fail-closed-when-unset treatment as the
    # native Google client id above.
    service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Disable the SMTP health probe. Spring Actuator's MailHealthIndicator opens
    # a live TCP connection to the SMTP relay on every /actuator/health call
    # (every 30 s via the Docker healthcheck). This floods logs with
    # UnknownHostException when the relay is temporarily unreachable and causes
    # the overall health status to report DOWN even when the app itself is fine.
    # Actual email send failures are surfaced in application logs at ERROR level.
    mail:
      enabled: false

logging:
  level:
    com.wealthynest: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
