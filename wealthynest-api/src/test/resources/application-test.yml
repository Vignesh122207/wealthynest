spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: none
wealthynest:
  security:
    jwt:
      secret: test-secret-key-for-testing-only-min-256-bits-long-enough
      access-token-expiry-ms: 900000
      refresh-token-expiry-ms: 2592000000
    vault:
      encryption-key: PdFeO5Ey1ku6QFnhkGIKas40BEDmfNhjjexyMC6Yx3A=
      hash-pepper: test-vault-hash-pepper-not-for-production
    cors:
      allowed-origins: http://localhost:3000
