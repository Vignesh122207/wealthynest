spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  cache:
    type: redis
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

wealthynest:
  security:
    jwt:
      secret: test-secret-key-for-testing-only-min-256-bits-long-enough
      access-token-expiry-ms: 900000
      refresh-token-expiry-ms: 2592000000
    vault:
      encryption-key: PdFeO5Ey1ku6QFnhkGIKas40BEDmfNhjjexyMC6Yx3A=
      hash-pepper: test-vault-hash-pepper-not-for-production
    cors:
      allowed-origins: http://localhost:3000
    # All integration tests share one Testcontainers Redis instance and MockMvc's default client
    # IP, so the real per-minute limits would trip across unrelated tests in the same run.
    rate-limit:
      auth-requests-per-minute: 100000
      api-requests-per-minute: 100000

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
