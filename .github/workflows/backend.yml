name: Deploy Backend

# backend-ci.yml already gates the PR that got merged to main — this re-runs build+test once more
# (guards against a bad merge/rebase reaching main undetected) and then actually ships it.
on:
  push:
    branches: [main]
    paths:
      - "wealthynest-api/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  id-token: write # required for AWS OIDC federation - no long-lived AWS keys anywhere in this repo
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: wealthynest-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile (fast fail)
        run: mvn -B compile

      # Full suite incl. @SpringBootTest + Testcontainers integration tests, same as backend-ci.yml.
      - name: Run tests
        run: mvn -B test

      - name: Package
        run: mvn -B package -DskipTests

      - name: Compute release version
        id: version
        run: echo "version=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: |
            wealthynest-api/target/*.jar
            infrastructure/scripts/deploy-backend.sh
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Read fresh every run instead of a static repo variable - a static AWS_APP_INSTANCE_ID
      # went stale and pointed at a terminated instance the first time ComputeStack replaced the
      # app server (2026-08-02 incident), silently deploying to a dead instance ID until someone
      # noticed the app was down. This parameter (see ComputeStack#APP_SERVER_INSTANCE_ID_PARAM)
      # is the single source of truth CicdStack/MonitoringStack already read the same way.
      - name: Resolve current app server instance ID
        id: instance
        run: |
          echo "id=$(aws ssm get-parameter --name /wealthynest/prod/app-server-instance-id --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"

      - name: Upload release to S3
        id: upload
        run: |
          set -euo pipefail
          JAR_PATH=$(find dist -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
          PREFIX="backend-releases/${{ needs.build.outputs.version }}"
          aws s3 cp "$JAR_PATH" "s3://${{ vars.AWS_BACKUP_BUCKET_NAME }}/${PREFIX}/app.jar"
          aws s3 cp "dist/infrastructure/scripts/deploy-backend.sh" "s3://${{ vars.AWS_BACKUP_BUCKET_NAME }}/${PREFIX}/deploy-backend.sh"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      # deploy-backend.sh (see infrastructure/scripts/) downloads the jar, writes /opt/wealthynest/current.env
      # from Secrets Manager, atomically flips the `current` symlink, restarts the systemd service, and
      # self-verifies against the *local* health endpoint before exiting 0 - a nonzero exit here already
      # means deploy-backend.sh's own rollback fired, so this step failing is itself a completed rollback,
      # not just a failure signal.
      - name: Deploy via SSM Run Command
        id: deploy
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "wealthynest-api deploy ${{ needs.build.outputs.version }}" \
            --parameters "commands=[\"aws s3 cp s3://${{ vars.AWS_BACKUP_BUCKET_NAME }}/${{ steps.upload.outputs.prefix }}/deploy-backend.sh /opt/wealthynest/scripts/deploy-backend.sh && chmod +x /opt/wealthynest/scripts/deploy-backend.sh && /opt/wealthynest/scripts/deploy-backend.sh '${{ vars.AWS_BACKUP_BUCKET_NAME }}' '${{ steps.upload.outputs.prefix }}/app.jar' '${{ needs.build.outputs.version }}'\"]" \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "${{ steps.instance.outputs.id }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ steps.instance.outputs.id }}" \
            --query "Status" --output text)
          echo "SSM command status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ steps.instance.outputs.id }}" \
            --query "StandardOutputContent" --output text
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "${{ steps.instance.outputs.id }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

      # continue-on-error here on purpose: a bare failure on this step used to fail the whole
      # `deploy` job, which skips `smoke` (needs: deploy) and blocks `rollback` (needs
      # deploy.result == 'success') - so a release that was actually fine but just took slightly
      # longer than 90s to become reachable through Cloudflare (a real, reproduced case: a
      # symlink-flip restart flap that self-resolved) reported as a total failure with no
      # automatic rollback for the one case a rollback would matter. Letting this step fail softly
      # hands the real go/no-go decision to `smoke`'s actual Playwright round trip against the live
      # site, which already has correct rollback wiring below - a release that's truly broken will
      # fail smoke too and roll back for real; one that just needed a few more seconds won't.
      - name: External health check (through Cloudflare, not just localhost)
        id: healthcheck
        continue-on-error: true
        run: |
          timeout 90 bash -c 'until curl -sf https://${{ vars.AWS_API_DOMAIN }}/actuator/health | grep -q "\"status\":\"UP\""; do sleep 5; done'

      - name: Warn if the external health check didn't pass within the timeout
        if: steps.healthcheck.outcome == 'failure'
        run: echo "::warning::External health check timed out - deploy-backend.sh's own local health check already passed before this ran. Not treating this alone as a failed release; the smoke job's real round trip against the live site decides whether to roll back."

  smoke:
    needs: deploy
    uses: ./.github/workflows/playwright.yml
    with:
      base-url: https://wealthynest.in
      api-url: https://api.wealthynest.in/api/v1

  # deploy-backend.sh already self-verifies against the local health endpoint before returning
  # success, so this only fires for the narrower case it can't catch on its own: the deploy
  # "succeeded" but the release is still behaviorally broken in a way only a real browser round
  # trip surfaces (frontend/backend contract drift, CORS, auth wiring). needs.deploy.result ==
  # 'success' guards against rolling back when the deploy step itself already failed and
  # self-rolled-back - nothing to roll back again in that case.
  rollback:
    needs: [deploy, smoke]
    if: always() && needs.deploy.result == 'success' && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Job outputs don't cross job boundaries, so this job resolves it fresh too - see the
      # `deploy` job's own "Resolve current app server instance ID" step for why this reads the
      # SSM parameter instead of a static repo variable.
      - name: Resolve current app server instance ID
        id: instance
        run: |
          echo "id=$(aws ssm get-parameter --name /wealthynest/prod/app-server-instance-id --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"

      - name: Roll back to the previous release
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "wealthynest-api rollback - post-deploy smoke check failed" \
            --parameters 'commands=["/opt/wealthynest/scripts/deploy-backend.sh --rollback"]' \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "${{ steps.instance.outputs.id }}" || true
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ steps.instance.outputs.id }}" \
            --query "Status" --output text)
          echo "Rollback status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ steps.instance.outputs.id }}" \
            --query "StandardOutputContent" --output text
          [ "$STATUS" = "Success" ]

      # The deploy technically ran, but the release it produced failed its smoke check and was
      # just rolled back - the workflow run as a whole must read as failed, not green.
      - name: Mark the workflow as failed
        run: |
          echo "::error::Deployed release failed post-deploy smoke checks and was rolled back to the previous release."
          exit 1
