name: E2E (Playwright)

# Deliberately NOT on push/pull_request — the 128-test regression suite needs the full
# docker-compose stack (postgres/redis/api/web) up, which takes several minutes to build and
# start, so it doesn't belong in the fast PR-gating path. Runs nightly and on-demand instead.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Throwaway secrets for an ephemeral CI-only stack — generated fresh every run, never
      # persisted, never real. Real deployments use actual secrets via the platform's own
      # env/secret store, not this file.
      - name: Generate ephemeral .env for the docker-compose stack
        run: |
          cat > .env <<EOF
          JWT_SECRET=$(openssl rand -base64 48)
          VAULT_ENCRYPTION_KEY=$(openssl rand -base64 32)
          VAULT_HASH_PEPPER=$(openssl rand -base64 32)
          DB_PASSWORD=$(openssl rand -hex 16)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          CORS_ORIGINS=http://localhost:3000
          FRONTEND_URL=http://localhost:3000
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_USERNAME=test
          MAIL_PASSWORD=test
          # MUST be browser-reachable, not the Docker-internal hostname - docker-compose.yml feeds
          # this straight into wealthynest-web's NEXT_PUBLIC_API_URL build arg, which Next.js bakes
          # directly into the CLIENT bundle (and this app's CSP connect-src). Every API call this
          # app makes - including login - runs client-side in the real browser (no server-side
          # fetches, no middleware/rewrites proxy this repo's own code was checked for one), so
          # "http://wealthynest-api:8080" here is never reachable at all from that browser: it's a
          # Docker-network-only DNS name. Confirmed the hard way - every request failed
          # net::ERR_NAME_NOT_RESOLVED, cascading into the same mass test failure the rate-limit
          # fix below was mistaken for fixing on an earlier attempt. Runner-published localhost
          # port instead, reachable both from the browser and from the Playwright/Node process
          # itself (see the removed per-step override this used to need, now redundant since this
          # is already the right value from here on).
          API_URL=http://localhost:8080/api/v1
          # The prod default (10 auth req/min) is per-IP; every Playwright worker here shares one
          # runner IP, and 4 workers x 128 tests hitting /api/v1/auth/* blows through that almost
          # immediately, 429-ing logins and cascading into unrelated test failures. Raised only for
          # this ephemeral CI stack.
          RATE_LIMIT_AUTH_PER_MINUTE=1000
          RATE_LIMIT_API_PER_MINUTE=5000
          EOF

      - name: Start the stack
        run: docker compose up -d --build postgres redis wealthynest-api wealthynest-web

      - name: Wait for API and web to become healthy
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health | grep -q "\"status\":\"UP\""; do sleep 3; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 3; done'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install Playwright
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # playwright/config/env.ts loads ../../.env (the repo-root file generated above) via
      # dotenv, so API_URL/DB_PASSWORD/everything else here is already the right, browser-and-
      # runner-reachable value — nothing to override per-step.
      - name: Run E2E suite
        working-directory: playwright
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 14

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
