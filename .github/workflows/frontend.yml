name: Deploy Frontend (Vercel)

# frontend-ci.yml already gates the PR (lint/type-check/test/build) - this only ships it.
#
# NOTE: if this Vercel project already has Vercel's own Git integration connected to this repo,
# that integration will *also* deploy on every push to main, racing this workflow. Use one or the
# other, not both - either disconnect the Git integration in the Vercel dashboard (Settings ->
# Git) and let this workflow be the only deploy path, or delete this workflow and rely on the Git
# integration alone. See docs/deployment-guide.md.
on:
  push:
    branches: [main]
    paths:
      - "wealthynest-web/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch: {}

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  # No `working-directory: wealthynest-web` default here on purpose - the linked Vercel project's
  # own "Root Directory" setting is already wealthynest-web, so `vercel build`/`deploy` need to run
  # from the repo root and let Vercel CLI apply that setting itself. Running from inside
  # wealthynest-web/ doubles the path (wealthynest-web/wealthynest-web) and fails with ENOENT -
  # reproduced, not theoretical (see PR history).
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project environment (production)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # Vercel's "Sensitive" env var flag is write-only - it can't be read back even at build
      # time, which silently breaks any NEXT_PUBLIC_* var marked that way: instead of the real
      # value, the built bundle gets the literal string "[SENSITIVE]" baked in, with no build
      # error. This shipped to production once already (broke Google sign-in for every user, only
      # caught by manually diffing the live bundle) - fail loud here instead of relying on that
      # again.
      - name: Verify no Sensitive-var placeholder leaked into the build
        run: |
          set -euo pipefail
          if grep -rl '\[SENSITIVE\]' .vercel/output/static 2>/dev/null; then
            echo "::error::Found the literal string '[SENSITIVE]' in the built bundle - a NEXT_PUBLIC_* environment variable is marked 'Sensitive' in Vercel. NEXT_PUBLIC_* vars are already exposed client-side by design and must never be marked Sensitive. Fix: Vercel project settings -> Environment Variables -> delete and re-add the affected variable(s) without checking Sensitive, for every affected environment."
            exit 1
          fi

      - name: Deploy prebuilt output
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
