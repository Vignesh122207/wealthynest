services:
  postgres:
    image: postgres:16-alpine
    container_name: wealthynest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       wealthynest
      POSTGRES_USER:     wealthynest
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Bound to localhost only — reachable from the host for local tooling/
    # `mvn spring-boot:run` against the dockerized DB, but not from the
    # network or internet the way a bare "5432:5432" mapping would be.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wealthynest-postgres-data:/var/lib/postgresql/data
    networks:
      - wealthynest-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthynest -d wealthynest"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wealthynest-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - wealthynest-redis-data:/data
    networks:
      - wealthynest-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  wealthynest-api:
    build:
      context: ./wealthynest-api
      dockerfile: Dockerfile
    container_name: wealthynest-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Loopback-only, matching postgres/redis above — the `tunnel` container reaches this over
    # the internal wealthynest-net bridge by service name, not through this host port mapping,
    # so restricting it doesn't affect Cloudflare Tunnel routing. Only closes direct LAN/internet
    # access to a bare "8080:8080" that would otherwise bypass the tunnel's TLS termination.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Overridable so the Google OAuth E2E test can opt into the `e2e-oauth-test` profile
      # (`APP_ENV=prod,e2e-oauth-test docker compose up -d --build wealthynest-api`) without
      # changing default behavior for a normal `docker compose up -d` — see playwright/README.md's
      # Google OAuth section.
      APP_ENV:      ${APP_ENV:-prod}
      DB_URL:       jdbc:postgresql://postgres:5432/wealthynest
      DB_USERNAME:  wealthynest
      DB_PASSWORD:  ${DB_PASSWORD}
      REDIS_HOST:   redis
      REDIS_PORT:   6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET:          ${JWT_SECRET}
      JWT_ACCESS_EXPIRY:   7200000
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      VAULT_HASH_PEPPER:    ${VAULT_HASH_PEPPER}
      CORS_ORIGINS:        ${CORS_ORIGINS}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-}
      # Numeric defaults here match application.yml's own fallback (10/200) exactly, so an unset
      # .env behaves identically to before - only an explicit override (e.g. the E2E workflow's
      # generous ephemeral-stack values) actually changes anything. Needed as an explicit forward
      # here at all because Compose does NOT auto-inject every .env key into a container's own
      # environment - only vars listed under this block reach it, regardless of what's in .env.
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_API_PER_MINUTE:  ${RATE_LIMIT_API_PER_MINUTE:-200}
      PORT:         8080
      MAIL_HOST:     ${MAIL_HOST}
      MAIL_PORT:     ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL:  ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # Web popup-code fallback (AuthServiceImpl.googleLoginPopup) - see that method's own comment
      # for why. Only needed if testing that specific fallback locally; the primary ID-token web
      # flow (googleLogin) never reads this.
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Native Android sign-in (Desktop app OAuth client) — see AuthServiceImpl.googleLoginNative
      # for why the backend, not the app, needs these to exchange an authorization code for an
      # ID token: Google requires this client secret for that exchange even with PKCE.
      GOOGLE_NATIVE_CLIENT_ID:     ${GOOGLE_NATIVE_CLIENT_ID:-}
      GOOGLE_NATIVE_CLIENT_SECRET: ${GOOGLE_NATIVE_CLIENT_SECRET:-}
      FCM_SERVICE_ACCOUNT_JSON:    ${FCM_SERVICE_ACCOUNT_JSON:-}
    networks:
      - wealthynest-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  wealthynest-web:
    build:
      context: ./wealthynest-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        # Separate from GOOGLE_CLIENT_ID (a "Web application" OAuth client, used by the browser
        # GIS flow below) — Google only allows custom-URI-scheme redirects (what the native
        # Capacitor OAuth flow needs, since it can't use an https redirect) on a "Desktop app"
        # type OAuth client. Create that as its own client in Google Cloud Console; the two IDs
        # are not interchangeable.
        NEXT_PUBLIC_GOOGLE_NATIVE_CLIENT_ID: ${GOOGLE_NATIVE_CLIENT_ID}
    container_name: wealthynest-web
    restart: unless-stopped
    depends_on:
      wealthynest-api:
        condition: service_healthy
    # Loopback-only — see the wealthynest-api port comment above for why this doesn't affect
    # tunnel-routed access.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
    networks:
      - wealthynest-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: wealthynest-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    volumes:
      - ~/.cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      wealthynest-api:
        condition: service_healthy
      wealthynest-web:
        condition: service_started
    networks:
      - wealthynest-net

networks:
  wealthynest-net:
    driver: bridge
    # Pinned (matches the subnet Docker had already auto-assigned) rather than left to dynamic
    # allocation — RATE_LIMIT_TRUSTED_PROXIES (.env) trusts this exact range so the rate limiter
    # can tell the `tunnel` container's traffic apart from a request that reached the API
    # directly; an unpinned subnet could drift to a different range on a network recreation and
    # silently break that trust check.
    ipam:
      config:
        - subnet: 172.19.0.0/16

volumes:
  wealthynest-postgres-data:
  wealthynest-redis-data:
